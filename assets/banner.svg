<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)"/>
    </pattern>
  </defs>

  <style>
    /* Dynamic floating and pulsing animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.15); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-18px) translateX(12px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(20px) translateX(-15px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes pulseCircuit {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.2; }
      50% { stroke-dashoffset: 60; opacity: 0.8; }
    }
    @keyframes orbRotate {
      0% { transform: rotate(0deg) translate(250px, 120px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(250px, 120px) rotate(-360deg); }
    }

    .ambient-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseGlow 10s ease-in-out infinite 2s;
      transform-origin: 1000px 320px;
    }
    .floating-1 {
      animation: floatParticle1 6s ease-in-out infinite;
    }
    .floating-2 {
      animation: floatParticle2 8s ease-in-out infinite 1s;
    }
    .circuit-line {
      stroke-dasharray: 20, 10;
      animation: pulseCircuit 4s linear infinite;
    }
    .badge-pill {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Light Orbs (Background layer) -->
  <g opacity="0.4">
    <circle class="ambient-orb-1" cx="220" cy="120" r="130" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle class="ambient-orb-2" cx="980" cy="300" r="160" fill="#818cf8" filter="url(#softGlow)"/>
    <circle class="ambient-orb-1" cx="600" cy="210" r="110" fill="#6366f1" filter="url(#softGlow)"/>
  </g>

  <!-- Dynamic Network / Flow Circuit Lines (Behind Content) -->
  <g fill="none" stroke-width="2">
    <path class="circuit-line" stroke="#38bdf8" d="M 60,80 Q 250,30 440,110 T 800,90 T 1140,60"/>
    <path class="circuit-line" stroke="#818cf8" d="M 50,350 Q 300,390 550,320 T 900,360 T 1150,340"/>
  </g>

  <!-- Dynamic Floating Decorative Particles (Behind Content) -->
  <g class="floating-1" opacity="0.6">
    <polygon points="120,180 135,160 150,180 135,200" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1060" cy="140" r="6" fill="#818cf8"/>
    <circle cx="150" cy="280" r="4" fill="#38bdf8"/>
    <polygon points="1020,240 1030,225 1040,240 1030,255" fill="none" stroke="#c084fc" stroke-width="2"/>
  </g>
  <g class="floating-2" opacity="0.5">
    <circle cx="280" cy="60" r="5" fill="#c084fc"/>
    <circle cx="920" cy="80" r="7" fill="#38bdf8"/>
    <polygon points="860,330 875,315 890,330 875,345" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Centered Card Frame (Subtle Glassmorphism overlay for foreground protection) -->
  <rect x="70" y="45" width="1060" height="330" rx="20" fill="rgba(15, 23, 42, 0.72)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Top Decorative Header Tag -->
  <g transform="translate(600, 95)">
    <rect x="-170" y="-18" width="340" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-145" cy="-1" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-125" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE RESILIENCE DIRECTORY</text>
  </g>

  <!-- Main Title (Strictly Foreground with Vibrant Gradient) -->
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Cloud-Native Data Resiliency
  </text>

  <!-- Subtitle (Always in Foreground) -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Immutable Backup • Cyber Recovery • Kubernetes DR • Multi-Cloud Business Continuity
  </text>

  <!-- Tagline / Secondary description -->
  <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Curated directory of SaaS category leaders and battle-tested open-source resilience engines
  </text>

  <!-- Foreground Feature Badges / Pills -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">☁️ SaaS Platforms</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Open Source</text>
    </g>

    <!-- Pill 3: Ransomware Defense -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#c084fc" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Cyber Recovery</text>
    </g>

    <!-- Pill 4: Kubernetes DR -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#34d399" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">☸️ Kubernetes DR</text>
    </g>
  </g>
</svg>
